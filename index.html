<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youness Naim | Full Stack Developer</title>
    <meta name="description" content="Portfolio de Youness Naim, Full Stack Developer spécialisé dans le développement d'applications web modernes." />
    <meta name="theme-color" content="#0f1117" />
    <meta property="og:title" content="Youness Naim | Full Stack Developer" />
    <meta property="og:description" content="Portfolio de Youness Naim, Full Stack Developer spécialisé dans le développement d'applications web modernes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:description" content="Portfolio de Youness Naim, Full Stack Developer spécialisé dans le développement d'applications web modernes." />
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var stored = window.localStorage.getItem('portfolio-theme')
          if (stored === 'dark' || stored === 'light') {
            theme = stored
          }
        } catch (error) {
          // localStorage unavailable (private mode, blocked context, ...)
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          meta.setAttribute('content', theme === 'light' ? '#f5f6fa' : '#0f1117')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
